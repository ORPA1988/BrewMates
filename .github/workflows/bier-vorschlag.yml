name: Bier-Vorschlag verarbeiten

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pr:
    name: PR aus Bier-Vorschlag erstellen
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'bier-vorschlag')
    steps:
      - name: Vorschlag parsen und PR erstellen
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const DATA_PATH = 'app/assets/data/beers-at.json';
            const FOOTER = '---\n_Generated by [Claude Code](https://claude.ai/code)_';

            async function comment(bodyText) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber, body: bodyText,
              });
            }

            // Issue-Form-Body parsen: Blöcke im Format "### <Feldlabel>\n\n<wert>"
            function parseIssueBody(body) {
              const fields = {};
              if (!body) return fields;
              const sections = body.split(/^###\s+/m).slice(1);
              for (const section of sections) {
                const newlineIndex = section.indexOf('\n');
                if (newlineIndex === -1) continue;
                const label = section.slice(0, newlineIndex).trim();
                let value = section.slice(newlineIndex + 1).trim();
                if (value === '_No response_' || value === '_Keine Antwort_') value = '';
                fields[label] = value;
              }
              return fields;
            }

            // Slug: lowercase, Umlaute transkribieren, alles außer [a-z0-9] zu '-'
            function slug(text) {
              return (text || '')
                .toLowerCase()
                .replace(/ä/g, 'ae')
                .replace(/ö/g, 'oe')
                .replace(/ü/g, 'ue')
                .replace(/ß/g, 'ss')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            }

            try {
              const fields = parseIssueBody(issue.body);
              const biername = fields['Biername'] || '';
              const brauerei = fields['Brauerei'] || '';
              const ort = fields['Ort'] || '';
              const stil = fields['Bierstil'] || '';
              const abvRaw = fields['Alkoholgehalt'] || '';
              const alkoholfreiRaw = fields['Alkoholfrei?'] || 'Nein';
              const eanRaw = fields['EAN/Barcode'] || '';
              const beschreibung = fields['Beschreibung'] || '';
              const quelle = fields['Quelle'] || '';

              if (!biername || !brauerei || !stil) {
                throw new Error('Pflichtfelder (Biername, Brauerei, Bierstil) fehlen oder konnten nicht gelesen werden.');
              }

              const abvParsed = parseFloat(abvRaw.replace(',', '.').replace(/[^0-9.\-]/g, ''));
              const abv = Number.isFinite(abvParsed) ? abvParsed : null;
              const isAlcoholFree = alkoholfreiRaw.trim().toLowerCase().startsWith('ja');

              // EAN: nur Ziffern behalten, nur Länge 8 oder 13 akzeptieren, sonst ignorieren
              const eanDigits = eanRaw.replace(/[^0-9]/g, '');
              const ean = (eanDigits.length === 8 || eanDigits.length === 13) ? eanDigits : '';

              const breweryId = 'at-' + slug(brauerei);
              const beerId = breweryId + '-' + slug(biername);

              const entry = {
                id: beerId,
                brewery_id: breweryId,
                name: biername,
                style: stil,
                abv: abv,
                ibu: null,
                is_alcohol_free: isAlcoholFree,
                barcodes: ean ? [ean] : [],
                description_manufacturer: null,
                description_community: beschreibung || null,
                community_rating: null,
              };

              // Aktuelle Datenbank vom main-Branch laden
              const { data: fileData } = await github.rest.repos.getContent({
                owner, repo, path: DATA_PATH, ref: 'main',
              });
              const db = JSON.parse(Buffer.from(fileData.content, 'base64').toString('utf8'));

              // Duplikat-Check
              if (Array.isArray(db.beers) && db.beers.some((b) => b.id === beerId)) {
                await comment(
                  'Danke für deinen Vorschlag! 🍺\n\n' +
                  'Ein Bier mit der ID `' + beerId + '` ist allerdings schon in der Datenbank vorhanden — ' +
                  'es wird daher kein Pull Request erstellt. Falls du eine Korrektur vorschlagen möchtest, ' +
                  'schreib das bitte hier ins Issue, ein Maintainer schaut drauf.\n\n' + FOOTER
                );
                return;
              }

              db.beers = db.beers || [];
              db.beers.push(entry);
              db.updated = new Date().toISOString().slice(0, 10);

              const newContent = JSON.stringify(db, null, 2) + '\n';
              const branchName = 'bier/' + issueNumber + '-' + slug(biername);

              // Branch von main erstellen (oder auf main zurücksetzen, falls er schon existiert)
              const { data: mainRef } = await github.rest.git.getRef({
                owner, repo, ref: 'heads/main',
              });
              try {
                await github.rest.git.createRef({
                  owner, repo, ref: 'refs/heads/' + branchName, sha: mainRef.object.sha,
                });
              } catch (refError) {
                if (refError.status === 422) {
                  await github.rest.git.updateRef({
                    owner, repo, ref: 'heads/' + branchName, sha: mainRef.object.sha, force: true,
                  });
                } else {
                  throw refError;
                }
              }

              // Datei auf dem Branch committen
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: DATA_PATH,
                branch: branchName,
                message: 'Bier-Vorschlag: ' + biername + ' (' + brauerei + ') aus Issue #' + issueNumber,
                content: Buffer.from(newContent, 'utf8').toString('base64'),
                sha: fileData.sha,
              });

              // Pull Request öffnen (oder existierenden wiederverwenden)
              const prTitle = 'Bier-Vorschlag: ' + biername + ' (#' + issueNumber + ')';
              const prBody = [
                'Automatisch erstellter Pull Request aus dem Community-Vorschlag in Issue #' + issueNumber + '.',
                '',
                '## Zusammenfassung',
                '',
                '| Feld | Wert |',
                '| --- | --- |',
                '| Bier | ' + biername + ' |',
                '| Brauerei | ' + brauerei + ' |',
                (ort ? '| Ort | ' + ort + ' |' : null),
                '| Stil | ' + stil + ' |',
                '| Alkoholgehalt | ' + (abv !== null ? abv + ' %' : '–') + ' |',
                '| Alkoholfrei | ' + (isAlcoholFree ? 'ja' : 'nein') + ' |',
                (quelle ? '| Quelle | ' + quelle + ' |' : null),
                '| ID | `' + beerId + '` |',
                '| brewery_id | `' + breweryId + '` |',
                '',
                '> ⚠️ **Hinweis für Maintainer:** Die `brewery_id` wurde automatisch aus dem Brauereinamen ' +
                'generiert. Bitte prüfen, ob die Brauerei bereits unter einer anderen ID existiert, ' +
                'und die `brewery_id` (und ggf. die Bier-`id`) entsprechend anpassen.',
                '',
                'Closes #' + issueNumber,
                '',
                FOOTER,
              ].filter((line) => line !== null).join('\n');

              let pr;
              try {
                const { data: created } = await github.rest.pulls.create({
                  owner, repo, title: prTitle, head: branchName, base: 'main', body: prBody,
                });
                pr = created;
              } catch (prError) {
                if (prError.status === 422) {
                  const { data: existing } = await github.rest.pulls.list({
                    owner, repo, head: owner + ':' + branchName, state: 'open',
                  });
                  if (existing.length > 0) {
                    pr = existing[0];
                    await github.rest.pulls.update({
                      owner, repo, pull_number: pr.number, title: prTitle, body: prBody,
                    });
                  } else {
                    throw prError;
                  }
                } else {
                  throw prError;
                }
              }

              await comment(
                'Danke für deinen Bier-Vorschlag! 🍻\n\n' +
                'Daraus wurde automatisch ein Pull Request erstellt: ' + pr.html_url + '\n' +
                'Ein Maintainer prüft den Eintrag und merged ihn dann in die Datenbank.\n\n' + FOOTER
              );
            } catch (error) {
              core.warning('Bier-Vorschlag konnte nicht verarbeitet werden: ' + error.message);
              try {
                await comment(
                  'Danke für deinen Vorschlag! 🍺\n\n' +
                  'Er konnte leider nicht automatisch verarbeitet werden — kein Problem, ' +
                  'ein Maintainer schaut drauf und übernimmt den Eintrag manuell.\n\n' + FOOTER
                );
              } catch (commentError) {
                core.warning('Kommentar konnte nicht erstellt werden: ' + commentError.message);
              }
            }
