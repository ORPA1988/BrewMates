name: Pages (Web-App + Datenschutz)

# EIN kombiniertes GitHub-Pages-Deployment:
#   https://orpa1988.github.io/BrewMates/          → die BrewMates-Web-App
#   https://orpa1988.github.io/BrewMates/privacy/  → Datenschutzerklärung
# Voraussetzung (einmalig): Repo → Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Web-App bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href /BrewMates/
      - name: Seite zusammenstellen (App + Datenschutz)
        run: |
          mkdir -p _site/privacy
          cp -r app/build/web/. _site/
          pip install markdown
          python3 <<'EOF'
          import markdown
          import pathlib

          body = markdown.markdown(
              pathlib.Path('PRIVACY.md').read_text(encoding='utf-8'),
              extensions=['tables'])
          html = ('<!doctype html><html lang="de"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width, initial-scale=1">'
                  '<title>BrewMates – Datenschutzerklärung</title>'
                  '<style>body{font-family:system-ui,sans-serif;max-width:48rem;'
                  'margin:2rem auto;padding:0 1rem;line-height:1.6;color:#222}'
                  'table{border-collapse:collapse}td,th{border:1px solid #ccc;'
                  'padding:.4rem}</style></head><body>' + body + '</body></html>')
          pathlib.Path('_site/privacy/index.html').write_text(
              html, encoding='utf-8')
          EOF
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
