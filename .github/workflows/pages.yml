name: Pages (Datenschutz)

# Veröffentlicht PRIVACY.md als hübsche HTML-Seite über GitHub Pages —
# die öffentliche Datenschutz-URL für den Play-Store-Eintrag.
# Voraussetzung (einmalig): Repo → Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - PRIVACY.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: PRIVACY.md nach HTML wandeln
        run: |
          pip install markdown
          mkdir -p _site
          python3 <<'EOF'
          import markdown
          import pathlib

          body = markdown.markdown(
              pathlib.Path('PRIVACY.md').read_text(encoding='utf-8'),
              extensions=['tables'])
          html = ('<!doctype html><html lang="de"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width, initial-scale=1">'
                  '<title>BrewMates – Datenschutzerklärung</title>'
                  '<style>body{font-family:system-ui,sans-serif;max-width:48rem;'
                  'margin:2rem auto;padding:0 1rem;line-height:1.6;color:#222}'
                  'table{border-collapse:collapse}td,th{border:1px solid #ccc;'
                  'padding:.4rem}</style></head><body>' + body + '</body></html>')
          pathlib.Path('_site/index.html').write_text(html, encoding='utf-8')
          EOF
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
