name: Release

# Ein Git-Tag `v*` (z. B. v1.0.0) baut die Android-App und veröffentlicht
# APK + AAB als öffentlich herunterladbares GitHub-Release.
# Fokus laut Produktentscheidung: Android (iOS-Option offen, kein
# Microsoft/Apple-Store-Prozess).

on:
  push:
    tags:
      - "v*"
  # Manuell aus dem Actions-Tab auslösbar („Run workflow"): erstellt
  # Tag + Release mit der angegebenen Version.
  workflow_dispatch:
    inputs:
      version:
        description: "Versions-Tag, z. B. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Android bauen & Release veröffentlichen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # AGP 8.1 (Flutter-3.24-Template) braucht JDK 17 – mit JDK 21
      # schlägt der jlink-Schritt fehl.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      # Stabile Signatur: Ist der Upload-Keystore als Secret hinterlegt,
      # wird das Release damit signiert — nur dann lassen sich Updates
      # über eine bestehende Installation einspielen (gleiche Signatur =
      # lokale Daten bleiben erhalten). Ohne Secrets: Debug-Signatur wie
      # bisher (Fallback, z. B. für Forks).
      - name: Signierung einrichten (Upload-Keystore aus Secrets)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            {
              echo "storeFile=../upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=brewmates"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "hint=Dieses Release ist mit dem BrewMates-Upload-Keystore signiert – Updates lassen sich direkt über eine bestehende Installation einspielen, alle lokalen Daten bleiben erhalten." >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "hint=Hinweis: Dieser Test-Build ist mit einem Debug-Schlüssel signiert; Updates über eine bestehende Installation können fehlschlagen (siehe docs/07-release-playbook.md, Abschnitt Signierung)." >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64-Secret fehlt – Release wird debug-signiert (Updates über bestehende Installationen schlagen fehl)."
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Version bestimmen
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Artefakte benennen
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "brewmates-${{ steps.version.outputs.tag }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "brewmates-${{ steps.version.outputs.tag }}.aab"
      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BrewMates ${{ steps.version.outputs.tag }}
          files: |
            app/brewmates-${{ steps.version.outputs.tag }}.apk
            app/brewmates-${{ steps.version.outputs.tag }}.aab
          body: |
            ## 🍻 BrewMates für Android

            **Installation:** Die `.apk`-Datei unten auf dem Android-Gerät
            herunterladen und öffnen. Beim ersten Mal fragt Android nach der
            Erlaubnis, Apps aus dieser Quelle zu installieren („Unbekannte
            Quellen") – einmal bestätigen, fertig.

            In der Online-Beta ist ein Konto erforderlich (E-Mail oder
            Google); Check-ins und Sessions sind nur für bestätigte
            Freunde sichtbar.

            ${{ steps.signing.outputs.hint }}

            Die `.aab`-Datei ist das Play-Store-Format und nur für den
            Store-Upload gedacht.
