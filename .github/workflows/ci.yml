name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Analyze & Test (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      # Die Zahl steht in der Job-Zusammenfassung, damit sie im PR sichtbar
      # ist, ohne Logs zu öffnen. `--min` ist eine Ratsche: Sie darf steigen,
      # nie sinken. Wer sie senkt, muss das im Diff begründen.
      #
      # Von 32 auf 43 am 2026-09-04: Tatsächlich waren es 44,5 %. Elf Punkte
      # Luft heißt, dass ein halbes Dutzend Bildschirme ungetestet werden
      # könnten, ohne dass hier etwas aufleuchtet — eine Ratsche, die nicht
      # greift, ist Dekoration.
      #
      # Am selben Tag weiter auf 46: Die Statistik-Ausbaustufe 2 brachte
      # den Stand auf 46,9 %. Der Abstand von knapp einem Punkt fängt
      # normale Schwankung ab, nicht mehr. Dieselbe Zahl steht in
      # `.vscode/tasks.json` — sie muss mitwandern, sonst meldet der
      # lokale Task grün, wo die CI rot wird.
      - run: dart ../tools/coverage_report.dart --min 46
      # Die acht JSON-Dateien sind der Inhalt der App und werden
      # redaktionell gepflegt — künftig auch von Menschen, die den Code
      # nicht kennen. Ein doppelter Barcode schickt den Scanner auf das
      # falsche Bier; das fällt beim Lesen nicht auf.
      - run: dart ../tools/validate_data.dart
      # Fängt dart:io-Regressionen: die App muss auch fürs Web bauen
      # (GitHub-Pages-Deployment, siehe pages.yml).
      - run: flutter build web --release
      # Regel J („Web ist Zweitgerät mit vollem Funktionsumfang") stand
      # bis hierher ungeprüft im Raum: Der Schritt darüber zeigt nur, dass
      # die App fürs Web ÜBERSETZT. Dieser hier lässt die Tests im Browser
      # LAUFEN — dort ist `int` ein double, `DateTime` hat keine
      # Mikrosekunden, und jede `kIsWeb`-Weiche nimmt den anderen Zweig.
      #
      # Was er NICHT abdeckt: 48 der 70 Testdateien tragen `@TestOn('vm')`
      # und bleiben draußen. Der Grund steht in jeder einzelnen Datei und
      # ist zweimal derselbe — Repo-Wächter lesen Dateien (`dart:io`), und
      # `AppDatabase.memory()` gibt es im Browser nicht. Die Rechnung samt
      # nächstem Schritt: docs/features/18-plattformen.md.
      #
      # Preis, am 2026-09-04 auf diesem Läufer gemessen: 4:23 für 153
      # Tests. Der Flutter-Job wächst damit von rund 3½ auf 8 Minuten —
      # das ist der Gegenwert dafür, dass „läuft im Browser" nicht mehr
      # geglaubt, sondern geprüft wird. Ohne die Ausnahmen dauerte
      # derselbe Befehl 7:43 und war rot.
      - run: flutter test --platform chrome

  rls:
    name: RLS & Migrationen (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          # Ohne Token fragt die Action anonym bei der GitHub-API nach der
          # neuesten Version — und laeuft in das Ratenlimit (2026-09-02:
          # „Failed to resolve latest Supabase CLI release: rate limit
          # exceeded", ein roter Lauf ohne Codeaenderung).
          #
          # Der Parameter heisst `github-token`. Er stand hier als `token`,
          # und die Action hat ihn kommentarlos ignoriert — sichtbar nur
          # als Warnung mitten im Protokoll: „Unexpected input(s) 'token',
          # valid inputs are ['version', 'github-token']". Das Ratenlimit
          # schlug deshalb am 2026-09-03 erneut zu.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Baut die Datenbank ALLEIN aus supabase/migrations/ auf. Das prüft
      # zweierlei auf einmal: dass die Migrationen from scratch
      # durchlaufen, und dass sie den Live-Stand vollständig beschreiben.
      # Genau daran hing 0025 — die Tabellenrechte standen in keiner
      # Migration, weil niemand den Aufbauweg je gegangen ist.
      - run: supabase start
      # Die Privatsphäre der App hängt an RLS. Diese Tests prüfen die
      # Policies selbst, nicht die Oberfläche — eine Regel, die nur die
      # App befolgt, ist keine.
      - run: supabase test db
