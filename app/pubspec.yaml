name: brewmates
description: "BrewMates – Bier entdecken, Freunde treffen. Untappd × Beer with Me."
publish_to: "none"
# Beta-Phase: 0.x bis zum offiziellen 1.0-Store-Release (versionCode zählt weiter)
version: 0.9.5-beta+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State-Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Lokale DB (v1 ist local-first; Supabase-Sync folgt in v2,
  # siehe docs/03-architektur.md)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Karte (OpenStreetMap – läuft auch auf Windows)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sonstiges
  intl: ^0.19.0
  uuid: ^4.4.2

  # Community-Datenbank von GitHub laden / Vorschläge einreichen
  http: ^1.2.2
  url_launcher: ^6.3.0

  # Hero-Funktionen: Barcode-Scanner + echtes GPS.
  # Versionen bewusst auf die Flutter-3.24-Toolchain gepinnt:
  # mobile_scanner 6+/geolocator 14+ verlangen neuere AGP/Kotlin/compileSdk.
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.2

  # Bier-Foto für Community-Einträge (gepinnt passend zur 3.24-Toolchain)
  image_picker: ^1.1.2

  # Online-Stufe (Beta): Konten, echte Freunde, Live-Beacon
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.8

flutter:
  uses-material-design: true
  assets:
    - assets/data/

# App-Icons für alle Plattformen aus einer Quelle:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#1C140F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256

# Windows-Paket:  dart run msix:create
# Standard: selbstsigniertes Test-Paket (sideload-fähig, CI-tauglich).
# Für den Microsoft Store: Identity-Werte aus dem Partner Center eintragen
# und mit `dart run msix:create --store` bauen (docs/07-release-playbook.md).
msix_config:
  display_name: BrewMates
  publisher_display_name: BrewMates
  identity_name: de.brewmates.app
  msix_version: 1.0.0.0
  logo_path: assets/icon/icon.png
  capabilities: internetClient,location
