name: brewmates
description: "BrewMates – Bier entdecken, Freunde treffen. Untappd × Beer with Me."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State-Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.6.0

  # Lokale DB / Offline-Cache
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Karte (OpenStreetMap – läuft auch auf Windows)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sonstiges
  intl: ^0.19.0
  cached_network_image: ^3.4.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
