// Workaround: Plugins wie geolocator_android lesen `flutter.compileSdkVersion`
// über die Projekt-Property-Kette; diese Map stellt die Werte bereit
// (muss zu den Flutter-3.24-Defaults im :app-Modul passen).
ext.flutter = [
    compileSdkVersion: 34,
    // 23 statt 21 seit 0.10.4: firebase_messaging verlangt Android 6.0
    // (2015). Darunter gibt es keine Play-Dienste mehr, die Push tragen.
    minSdkVersion    : 23,
    targetSdkVersion : 34,
]

// geolocator_android liest die AGP-Version aus dem buildscript-Classpath;
// mit dem reinen plugins-DSL des Flutter-Templates ist der leer und die
// Plugin-Konfiguration scheitert („substring() on null"). Die Version hier
// MUSS mit settings.gradle (com.android.application) übereinstimmen.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        // Firebase Cloud Messaging (Push). Liest android/app/google-services.json
        // und erzeugt daraus die Ressourcen, die firebase_core beim Start
        // braucht. Nur Android — Web und Tests kommen ohne Firebase aus.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
